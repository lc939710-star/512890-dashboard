name: Daily 512890 Signal

on:
  schedule:
    - cron: '17 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas requests

      - name: Run daily signal script
        env:
          SERVER_SENDKEY: ${{ secrets.SERVER_SENDKEY }}
        run: python daily_signal.py

      - name: Commit updated history.csv
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.csv
          git diff --cached --quiet || git commit -m "chore: daily update"
          git push
